:project:
  :which_ceedling: gem
  :ceedling_version: 1.1.8
  :use_mocks: FALSE
  :use_test_preprocessor: :all
  :build_root: build
  :test_file_prefix: test_
  :default_tasks:
    - test:all

:paths:
  :test:
    - .
  :source:
    - ../src
    - "@ESY_LLHTTP_PATH@/src"
  :include:
    - ../include
    - ../include/esy_middleware/http
    - ../../network/include
    - ../../../esy_common/defs/include
    - ../../../esy_common/defs/include/esy_common/defs/**
    - "@ESY_LLHTTP_PATH@/include"

:files:
  :test: []
  :source:
    - ../src/esy_http_client.c
  :support:
    - "@ESY_LLHTTP_PATH@/src/api.c"
    - "@ESY_LLHTTP_PATH@/src/http.c"
    - "@ESY_LLHTTP_PATH@/src/llhttp.c"

:defines:
  :test:
    - TEST

:plugins:
  :enabled:
    - report_tests_pretty_stdout
    - compile_commands_json_db
    - gcov

:gcov:
  :reports:
    - Text
    - HtmlDetailed
    - Json
  :gcovr:
    :report_root: ".."
    :json_artifact_filename: coverage.json
    :report_include: '../src/.*'

:flags:
  :test:
    :compile:
      - -std=c11
      - -Wall
      - -Wextra
  :gcov:
    :compile:
      - -std=c11
