:project:
  :which_ceedling: gem
  :ceedling_version: 1.1.8
  :use_mocks: FALSE
  :use_test_preprocessor: :all
  :build_root: build
  :test_file_prefix: test_
  :default_tasks:
    - test:all

:paths:
  :test:
    - .
  :source:
    - ../../src
    - ../../../../esy_common/ds/src
    - ../../../../esy_test/fake/third_party/lwip
    - lwip_support
  :include:
    - .
    - lwip_support
    - ../../include
    - ../../include/esy_middleware/network
    - ../../../../esy_common/defs/include
    - ../../../../esy_common/defs/include/esy_common/defs/**
    - ../../../../esy_common/ds/include
    - ../../../../esy_common/utils/include
    - ../../../../esy_common/utils/include/esy_common/utils/**
    - ../../../../esy_test/fake/third_party/lwip

:files:
  :test: []
  :source: []
  :support:
    - ../../src/esy_network_lwip.c
    - ../../../../esy_common/ds/src/esy_ring_buffer.c
    - ../../../../esy_test/fake/third_party/lwip/fake_lwip.c
    - lwip_support/network_lwip_dns_fixture.c

:defines:
  :test:
    - TEST

:plugins:
  :enabled:
    - report_tests_pretty_stdout
    - compile_commands_json_db
    - gcov

:gcov:
  :reports:
    - Text
    - HtmlDetailed
    - Json
  :gcovr:
    :report_root: "../.."
    :json_artifact_filename: coverage.json
    :report_include: "../../src/.*"

:flags:
  :test:
    :compile:
      - -std=c11
      - -Wall
      - -Wextra
      - -Werror
  :gcov:
    :compile:
      - -std=c11
