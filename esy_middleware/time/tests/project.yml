:project:
  :which_ceedling: gem
  :ceedling_version: 1.1.8
  :use_mocks: FALSE
  :use_test_preprocessor: :all
  :build_root: build
  :test_file_prefix: test_
  :default_tasks:
    - test:all

:paths:
  :test:
    - .
  :source:
    - ../src
  :include:
    - ../include
    - ../include/esy_middleware/time
    - ../../../esy_common/defs/include
    - ../../../esy_common/defs/include/esy_common/defs/**
    - ../../../esy_common/utils/include
    - ../../../esy_common/utils/include/esy_common/utils/**
    - ../../../esy_hal/include

:files:
  :source:
    - ../src/esy_time.c
    - ../src/esy_sntp.c
    - ../src/esy_time_rtc.c
  :support:
    - ../../../esy_hal/src/esy_hal_rtc.c
    - ../../../esy_common/utils/src/time/esy_datetime.c

:plugins:
  :enabled:
    - report_tests_pretty_stdout
    - compile_commands_json_db
    - gcov

:gcov:
  :reports:
    - Text
    - HtmlDetailed
    - Json
  :gcovr:
    :json_artifact_filename: coverage.json
    :report_include: "../src/.*"

:tools:
  :test_compiler:
    :name: gcc
    :flags:
      - -std=c11
      - -Wall
      - -Wextra
      - -Werror
      - -fprofile-arcs
      - -ftest-coverage
  :test_linker:
    :name: gcc
    :flags:
      - -fprofile-arcs
      - -ftest-coverage
