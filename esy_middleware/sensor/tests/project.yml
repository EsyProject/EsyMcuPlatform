:project:
  :which_ceedling: gem
  :ceedling_version: 1.1.8
  :use_mocks: FALSE
  :use_test_preprocessor: :all
  :build_root: build
  :test_file_prefix: test_
  :default_tasks:
    - test:all

:paths:
  :test:
    - .
  :source:
    - ../src
  :include:
    - ../include
    - ../include/esy_middleware/sensor
    - ../../../esy_common/defs/include
    - ../../../esy_common/defs/include/esy_common/defs/**
    - ../../../esy_hal/include
    - ../../../esy_test/fake/hal

:files:
  :source:
    - ../src/esy_sensor.c
    - ../src/esy_sensor_sht3x.c
    - ../src/esy_sensor_mpu6050.c
    - ../src/esy_sensor_ina219.c
  :support:
    - ../../../esy_test/fake/hal/fake_esy_hal_i2c.c
    - ../../../esy_test/fake/hal/fake_esy_hal_system.c

:plugins:
  :enabled:
    - report_tests_pretty_stdout
    - compile_commands_json_db
    - gcov

:gcov:
  :reports:
    - Text
    - HtmlDetailed
    - Json
  :gcovr:
    :json_artifact_filename: coverage.json
    :report_include: "../src/.*"

:tools:
  :test_compiler:
    :name: gcc
    :flags:
      - -std=c11
      - -Wall
      - -Wextra
      - -Werror
      - -fprofile-arcs
      - -ftest-coverage
  :test_linker:
    :name: gcc
    :flags:
      - -fprofile-arcs
      - -ftest-coverage
