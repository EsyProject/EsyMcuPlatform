:project:
  :which_ceedling: gem
  :ceedling_version: 1.1.8
  :use_mocks: FALSE
  :use_test_preprocessor: :all
  :build_root: build
  :test_file_prefix: test_
  :default_tasks:
    - test:all

:paths:
  :test:
    - .
  :source:
    - ../src
  :include:
    - .
    - ../include
    - ../include/esy_middleware/usb
    - ../../../esy_common/defs/include
    - ../../../esy_common/defs/include/esy_common/defs/**
    - ../../../esy_common/utils/include
    - ../../../esy_common/utils/include/esy_common/utils/**
    - ../../../esy_common/utils/include/esy_common
    - ../../../esy_test/fake/third_party/tinyusb

:files:
  :test: []
  :source: []
  :support:
    - ../src/esy_usb_cdc_backend_tinyusb.c
    - ../../../esy_test/fake/third_party/tinyusb/fake_tinyusb.c

:defines:
  :test:
    - TEST
    - CFG_TUD_CDC=2u

:plugins:
  :enabled:
    - report_tests_pretty_stdout
    - compile_commands_json_db
    - gcov

:gcov:
  :reports:
    - Text
    - HtmlDetailed
  :gcovr:
    :report_include: "../src/.*"

:tools:
  :test_compiler:
    :name: gcc
    :flags:
      - -std=c11
      - -fprofile-arcs
      - -ftest-coverage
  :test_linker:
    :name: gcc
    :flags:
      - -fprofile-arcs
      - -ftest-coverage
