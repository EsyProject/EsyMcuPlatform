:project:
  :which_ceedling: gem
  :ceedling_version: 1.1.8
  :use_mocks: FALSE
  :use_test_preprocessor: :all
  :build_root: build
  :test_file_prefix: test_
  :default_tasks:
    - test:all

:paths:
  :test:
    - .
  :source:
    - ../src
  :include:
    - .
    - ../src
    - ../include
    - ../include/esy_middleware/ota
    - ../../../esy_common/defs/include
    - ../../../esy_common/defs/include/esy_common/defs/**
    - ../../../esy_common/utils/include
    - ../../../esy_common/utils/include/esy_common/utils/**
    - ../../../esy_common/utils/include/esy_common
    - ../../../esy_hal/include
    - ../../bootloader/include
    - ../../../esy_hal/include/esy_hal
    - ../../../esy_test/fake/hal
    - ../../../esy_test/fake/bootloader

:files:
  :test: []
  :source:
    - ../src/esy_ota.c
    - ../src/esy_ota_flash.c
  :support:
    - ../../../esy_common/utils/src/integrity/esy_crc32.c
    - ../../../esy_common/utils/src/integrity/esy_sha256.c
    - ../../../esy_test/fake/bootloader/fake_esy_bootloader.c
    - ../../../esy_test/fake/hal/fake_esy_hal_flash.c

:defines:
  :test:
    - TEST

:plugins:
  :enabled:
    - report_tests_pretty_stdout
    - compile_commands_json_db
    - gcov

:gcov:
  :reports:
    - Text
    - HtmlDetailed
    - Json
  :gcovr:
    :report_include: "../src/.*"
    :json_artifact_filename: coverage.json

:tools:
  :test_compiler:
    :name: gcc
    :flags:
      - -std=c11
      - -Wall
      - -Wextra
      - -Werror
      - -fprofile-arcs
      - -ftest-coverage
  :test_linker:
    :name: gcc
    :flags:
      - -fprofile-arcs
      - -ftest-coverage
