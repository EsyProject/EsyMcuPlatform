:project:
  :which_ceedling: gem
  :ceedling_version: 1.1.8
  :use_mocks: FALSE
  :use_test_preprocessor: :all
  :build_root: build
  :test_file_prefix: test_
  :default_tasks:
    - test:all

:paths:
  :test:
    - .
  :source:
    - ../src
  :include:
    - ../include
    - ../include/esy_middleware/ble
    - ../../../esy_common/defs/include
    - ../../../esy_common/defs/include/esy_common/defs/**

:files:
  :source:
    - ../src/esy_ble.c
    # The optional native adapter has a separate explicit-stack runtime suite.
    - -:../src/esy_ble_btstack.c

:plugins:
  :enabled:
    - report_tests_pretty_stdout
    - compile_commands_json_db
    - gcov

:gcov:
  :reports:
    - Text
    - HtmlDetailed
    - Json
  :gcovr:
    :report_root: ".."
    :json_artifact_filename: coverage.json
    :report_include: "../src/esy_ble\\.c$"

:tools:
  :test_compiler:
    :name: gcc
    :flags:
      - -std=c11
      - -Wall
      - -Wextra
      - -Werror
      - -fprofile-arcs
      - -ftest-coverage
  :test_linker:
    :name: gcc
    :flags:
      - -fprofile-arcs
      - -ftest-coverage
