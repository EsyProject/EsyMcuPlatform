:project:
  :which_ceedling: gem
  :ceedling_version: 1.1.8
  :use_mocks: FALSE
  :use_test_preprocessor: :all
  :build_root: build
  :test_file_prefix: test_
  :default_tasks:
    - test:all

:paths:
  :test:
    - .
  :source:
    - ../src/freertos
    - ../src/freertos/port/esp32
  :include:
    - .
    - freertos
    - ../include
    - ../include/esy_middleware/os
    - ../../../esy_common/defs/include
    - ../../../esy_common/defs/include/esy_common/defs/**
    - ../../../esy_hal/include
    - ../../../esy_hal/include/esy_hal

:files:
  :test: []
  :source: []
  :support:
    - ../src/freertos/esy_os_task_snapshot.c
    - native_test_support.c
    - queue_test_support.c
    - snapshot_test_support.c

:defines:
  :test:
    - TEST

:plugins:
  :enabled:
    - report_tests_pretty_stdout
    - compile_commands_json_db
    - gcov

:gcov:
  :reports:
    - Text
    - HtmlDetailed
    - Json
  :gcovr:
    :json_artifact_filename: coverage.json
    :report_include: "../src/freertos/.*"

:tools:
  :test_compiler:
    :name: gcc
    :flags:
      - -std=c11
      - -fprofile-arcs
      - -ftest-coverage
  :test_linker:
    :name: gcc
    :flags:
      - -fprofile-arcs
      - -ftest-coverage
