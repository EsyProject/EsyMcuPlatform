:project:
  :which_ceedling: gem
  :ceedling_version: 1.1.8
  :use_mocks: FALSE
  :use_test_preprocessor: :all
  :build_root: build
  :test_file_prefix: test_
  :default_tasks:
    - test:all

:paths:
  :test:
    - .
  :source:
    - ../src
    - ../../../esy_test/fake/hal
  :include:
    - .
    - ../include
    - ../src
    - ../include/esy_middleware/freq_synth
    - ../../../esy_common/defs/include
    - ../../../esy_common/defs/include/esy_common/defs/**
    - ../../../esy_common/device/include
    - ../../../esy_common/utils/include
    - ../../../esy_common/utils/include/esy_common/utils/**
    - ../../../esy_common/utils/include/esy_common
    - ../../../esy_hal/include
    - ../../../esy_hal/include/esy_hal
    - ../../../esy_test/fake/hal

:files:
  :test: []
  :source: []
  :support:
    - ../src/esy_freq_synth.c
    - ../src/esy_freq_synth_device.c
    - ../src/esy_adf4351.c
    - ../src/esy_adf4351_device.c
    - ../src/esy_adf4372.c
    - ../src/esy_adf4372_device.c
    - ../src/esy_lmx2594.c
    - ../src/esy_lmx2592.c
    - ../../../esy_test/fake/hal/fake_esy_hal_gpio.c
    - ../../../esy_test/fake/hal/fake_esy_hal_spi.c
    - ../../../esy_test/fake/hal/fake_esy_hal_system.c
    - ../../../esy_test/fake/hal/fake_esy_hal_gpio_pm.c
    - ../../../esy_common/device/src/esy_device.c

:defines:
  :test:
    - TEST
    - FAKE_ESY_HAL_SPI_TX_HISTORY=512

:plugins:
  :enabled:
    - report_tests_pretty_stdout
    - compile_commands_json_db
    - gcov

:gcov:
  :reports:
    - Text
    - HtmlDetailed
  :gcovr:
    :report_include: "../src/.*"

:flags:
  :test:
    :compile:
      '*':
        - -std=c11
        - -Wall
        - -Wextra
        - -Werror
