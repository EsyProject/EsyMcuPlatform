:project:
  :which_ceedling: gem
  :ceedling_version: 1.1.8
  :use_mocks: FALSE
  :use_test_preprocessor: :all
  :build_root: build
  :test_file_prefix: test_
  :default_tasks:
    - test:all

:paths:
  :test:
    - .
  :source:
    - ../src
  :include:
    - ../include
    - ../include/esy_middleware/tls
    - ../../credentials/include
    - ../../crypto/include
    - ../../network/include
    - ../../../esy_common/defs/include
    - ../../../esy_common/defs/include/esy_common/defs/**
    - ../../../esy_common/utils/include
    - ../../../esy_common/utils/include/esy_common/utils/**
    - support
    - "@ESY_MBEDTLS_PATH@/include"
    - "@ESY_MBEDTLS_PATH@/library"

:files:
  :source:
    - ../src/esy_tls.c
  :support:
    - ../../credentials/src/esy_credentials.c
    - ../../../esy_common/utils/src/time/esy_datetime.c
    - "@ESY_MBEDTLS_PATH@/library/*.c"

:defines:
  :test:
    - TEST

:plugins:
  :enabled:
    - report_tests_pretty_stdout
    - compile_commands_json_db
    - gcov

:gcov:
  :reports:
    - Text
    - HtmlDetailed
    - Json
  :gcovr:
    :report_root: ".."
    :json_artifact_filename: coverage.json
    :report_include: '../src/.*'

:flags:
  :test:
    :compile:
      - -std=c11
      - -Wall
      - -Wextra
  :gcov:
    :compile:
      - -std=c11
