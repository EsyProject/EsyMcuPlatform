:project:
  :which_ceedling: gem
  :ceedling_version: 1.1.8
  :use_mocks: FALSE
  :use_test_preprocessor: :all
  :build_root: build
  :test_file_prefix: test_
  :default_tasks:
    - test:all

:paths:
  :test:
    - .
  :source:
    - ../src
  :include:
    - .
    - ../include
    - ../include/esy_middleware/power_manager
    - ../../../esy_common/device/include
    - ../../../esy_common/device/include/esy_common/device
    - ../../../esy_common/defs/include
    - ../../../esy_common/defs/include/esy_common/defs/**
    - ../../../esy_hal/include
    - ../../../esy_hal/include/esy_hal
    - ../../os/include
    - ../../os/include/esy_middleware/os
    - ../../os/tests
    - ../../os/tests/freertos
    - ../../watchdog_monitor/include
    - ../../watchdog_monitor/include/esy_middleware/watchdog_monitor

:files:
  :test: []
  :source: []
  :support:
    - ../src/esy_power_manager.c
    - ../src/esy_power_hal_backend.c
    - ../src/esy_power_tickless_adapter.c
    - ../src/esy_power_wakeup_timer_adapter.c
    - ../src/esy_power_watchdog_constraint.c
    - ../../../esy_common/device/src/esy_device.c
    - ../../os/src/freertos/esy_os.c

:defines:
  :test:
    - TEST

:plugins:
  :enabled:
    - report_tests_pretty_stdout
    - compile_commands_json_db
    - gcov

:gcov:
  :reports:
    - Text
    - HtmlDetailed
    - Json
  :gcovr:
    :config_file: gcovr.cfg
    :report_root: "../../.."
    :json_artifact_filename: coverage.json

:tools:
  :test_compiler:
    :name: gcc
    :flags:
      - -std=c11
      - -fprofile-arcs
      - -ftest-coverage
  :test_linker:
    :name: gcc
    :flags:
      - -fprofile-arcs
      - -ftest-coverage
