:project:
  :which_ceedling: gem
  :ceedling_version: 1.1.8
  :use_mocks: FALSE
  :use_test_preprocessor: :all
  :build_root: build
  :test_file_prefix: test_
  :default_tasks:
    - test:all

:paths:
  :test:
    - .
  :source:
    - ..
  :include:
    - .
    - ..
    - ../../../../esy_common/defs/include
    - ../../../../esy_common/defs/include/esy_common/defs/**
    - ../../../../esy_middleware/os/include
    - ../../../../esy_middleware/os/include/esy_middleware/os
    - ../../../../esy_middleware/watchdog_monitor/include
    - ../../../../esy_middleware/watchdog_monitor/include/esy_middleware/watchdog_monitor

:files:
  :test: []
  :source: []
  :support:
    - ../fake_esy_watchdog_monitor.c

:defines:
  :test:
    - TEST

:plugins:
  :enabled:
    - report_tests_pretty_stdout
    - compile_commands_json_db
    - gcov

:gcov:
  :reports:
    - Text
    - HtmlDetailed
  :gcovr:
    :report_include: ".*fake_esy_watchdog_monitor\\.c"

:tools:
  :test_compiler:
    :name: gcc
    :flags:
      - -std=c11
      - -Wall
      - -Wextra
      - -Werror
      - -fprofile-arcs
      - -ftest-coverage
  :test_linker:
    :name: gcc
    :flags:
      - -fprofile-arcs
      - -ftest-coverage
