:project:
  :which_ceedling: gem
  :ceedling_version: 1.1.8
  :use_mocks: FALSE
  :use_test_preprocessor: :all
  :build_root: build
  :test_file_prefix: test_
  :default_tasks:
    - test:all

:paths:
  :test:
    - .
  :source:
    - ..
  :include:
    - .
    - ..
    - ../../../../esy_common/defs/include
    - ../../../../esy_common/defs/include/esy_common/defs/**
    - ../../../../esy_middleware/os/include
    - ../../../../esy_middleware/os/include/esy_middleware/os

:files:
  :test: []
  :source: []
  :support:
    - ../fake_esy_os_task.c
    - ../fake_esy_os_timer.c
    - ../fake_esy_os_queue.c

:defines:
  :test:
    - TEST

:plugins:
  :enabled:
    - report_tests_pretty_stdout
    - compile_commands_json_db
    - gcov

:gcov:
  :reports:
    - Text
    - HtmlDetailed
  :gcovr:
    :report_include: "../fake_esy_os_.*\\.c"

:tools:
  :test_compiler:
    :name: gcc
    :flags:
      - -std=c11
      - -fprofile-arcs
      - -ftest-coverage
  :test_linker:
    :name: gcc
    :flags:
      - -fprofile-arcs
      - -ftest-coverage
