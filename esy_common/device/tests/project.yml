:project:
  :which_ceedling: gem
  :ceedling_version: 1.1.8
  :use_mocks: FALSE
  :use_test_preprocessor: :all
  :build_root: build
  :test_file_prefix: test_
  :default_tasks:
    - test:all

:paths:
  :test:
    - .
  :source:
    - ../src
  :include:
    - .
    - ../include
    - ../include/esy_common/device
    - ../../defs/include
    - ../../defs/include/esy_common/defs/**

:files:
  :test: []
  :source: []
  :support:
    - ../src/esy_device.c

:defines:
  :test:
    - TEST

:plugins:
  :enabled:
    - report_tests_pretty_stdout
    - compile_commands_json_db
    - gcov

:gcov:
  :reports:
    - Text
    - HtmlDetailed
  :gcovr:
    :report_include: "../src/.*"

:tools:
  :test_compiler:
    :name: gcc
    :flags:
      - -std=c11
      - -pthread
      - -fprofile-arcs
      - -ftest-coverage
  :test_linker:
    :name: gcc
    :flags:
      - -pthread
      - -fprofile-arcs
      - -ftest-coverage
