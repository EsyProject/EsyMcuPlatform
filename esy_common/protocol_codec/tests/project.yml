:project:
  :which_ceedling: gem
  :ceedling_version: 1.1.8
  :use_mocks: FALSE
  :use_test_preprocessor: :all
  :build_root: build
  :test_file_prefix: test_
  :default_tasks:
    - test:all

:paths:
  :test:
    - .
  :source:
    - ../src
    - ../../utils/src/**
  :include:
    - .
    - ../include
    - ../include/esy_common/protocol
    - ../../defs/include
    - ../../defs/include/esy_common/defs/**
    - ../../utils/include
    - ../../utils/include/esy_common/utils/**
    - ../../utils/include/esy_common

:files:
  :test: []
  :source: []
  :support:
    - ../src/esy_proto_bin.c
    - ../src/esy_proto_modbus.c
    - ../src/esy_proto_tlv.c
    - ../../utils/src/integrity/esy_crc32.c

:defines:
  :test:
    - TEST

:plugins:
  :enabled:
    - report_tests_pretty_stdout
    - compile_commands_json_db
    - gcov

:gcov:
  :reports:
    - Text
    - HtmlDetailed
  :gcovr:
    :report_include: '../src/esy_proto_(bin|modbus|tlv)\.c$'

:flags:
  :test:
    :compile:
      - -std=c11
  :gcov:
    :compile:
      - -std=c11
