:project:
  :which_ceedling: gem
  :ceedling_version: 1.1.8
  :use_mocks: FALSE
  :use_test_preprocessor: :all
  :build_root: build
  :test_file_prefix: test_
  :default_tasks:
    - test:all

:paths:
  :test:
    - .
  :source:
    - ../../src
    - "@ESY_COREJSON_PATH@/source"
  :include:
    - ../../include
    - ../../include/esy_common/protocol
    - ../../../defs/include
    - ../../../defs/include/esy_common/defs/**
    - "@ESY_COREJSON_PATH@/source/include"

:files:
  :test: []
  :source: []
  :support:
    - ../../src/esy_proto_json_reader.c
    - ../../src/esy_proto_json_writer.c
    - "@ESY_COREJSON_PATH@/source/core_json.c"

:defines:
  :test:
    - TEST

:plugins:
  :enabled:
    - report_tests_pretty_stdout
    - compile_commands_json_db
    - gcov

:gcov:
  :reports:
    - Text
    - HtmlDetailed
  :gcovr:
    :report_include: '../../src/esy_proto_json_.*'

:flags:
  :test:
    :compile:
      - -std=c11
      - -Wall
      - -Wextra
  :gcov:
    :compile:
      - -std=c11
